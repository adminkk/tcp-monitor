<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TCP 连接趋势</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#deebff;background:#0b1220;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:36px 24px}
    header{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:28px;margin:8px 0}p{color:#93a8c7;font-size:14px;line-height:1.7}
    .eyebrow{color:#60d9c0;font-size:12px;letter-spacing:2px}.badge{background:#173c37;color:#79e3cd;border-radius:20px;padding:8px 14px;font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.card,.panel{background:#111e31;border:1px solid #26364f;border-radius:14px;padding:20px}.label{color:#9eb0cb;font-size:13px}.value{font-size:32px;font-weight:650;margin-top:8px;font-variant-numeric:tabular-nums}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}button,select,.file,input[type=datetime-local]{font:inherit;background:#1b2c44;color:#deebff;border:1px solid #364b68;border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer}button:hover,.file:hover{border-color:#60d9c0}input[type=file]{display:none}input[type=checkbox]{accent-color:#60d9c0}.grow{flex:1}.small{font-size:13px;color:#93a8c7}.chart{position:relative;height:350px}canvas{width:100%;height:100%;display:block}.tooltip{display:none;position:absolute;pointer-events:none;background:#07101f;border:1px solid #54708c;padding:9px;border-radius:7px;font-size:12px;white-space:pre-line}
    #message{min-height:24px;color:#a3b8d5;font-size:13px;line-height:1.6;margin:16px 0}.table-wrap{overflow:auto;max-height:340px}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}th,td{padding:12px;border-bottom:1px solid #26364f}th{color:#9eb0cb;position:sticky;top:0;background:#111e31}.section-title{font-size:16px;margin:0 0 14px}footer{margin-top:20px;color:#8499b6;font-size:12px;line-height:1.8}
    @media(max-width:650px){main{padding:20px 12px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel{padding:14px}.chart{height:290px}.value{font-size:27px}}
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">NETWORK / TCP</div><h1>TCP 连接趋势</h1><p>每分钟连接快照 · 按保留天数滚动清理</p></div><span class="badge" id="badge">等待数据</span></header>
  <div class="stats">
    <div class="card"><div class="label">区间末次连接数</div><div class="value" id="current">—</div></div>
    <div class="card"><div class="label">区间峰值</div><div class="value" id="peak">—</div></div>
    <div class="card"><div class="label">区间均值</div><div class="value" id="average">—</div></div>
    <div class="card"><div class="label">区间缺测 / 总样本</div><div class="value" id="samples">—</div></div>
  </div>
  <section class="panel">
    <div class="toolbar">
      <label class="small">端口 <select id="port"><option value="all">全部端口合计</option></select></label>
      <label class="small">时间范围 <select id="range"><option value="1">最近 1 小时</option><option value="6">最近 6 小时</option><option value="24" selected>最近 24 小时</option><option value="168">最近 7 天</option><option value="0">全部保留数据</option><option value="custom" disabled>自定义时间</option></select></label>
      <span class="grow"></span><label class="small"><input type="checkbox" id="auto" checked> 每 60 秒刷新</label>
      <button id="refresh">刷新</button><button id="online">读取服务器文本</button>
      <label class="file">导入文本<input id="file" type="file" accept=".txt,.jsonl,text/plain"></label>
    </div>
    <div class="toolbar"><label class="small">开始 <input id="start" type="datetime-local" step="1"></label><label class="small">结束 <input id="end" type="datetime-local" step="1"></label><button id="apply">应用时间范围</button><span class="small">使用浏览器本地时区</span></div>
    <div class="small" id="scope">来源：tcp_connections.txt</div>
    <div class="chart"><canvas id="chart" aria-label="TCP 连接数随时间变化的折线图" role="img"></canvas><div class="tooltip" id="tooltip"></div></div>
    <div id="message" role="status"></div>
    <div id="legacy" class="small" role="status"></div>
    <div id="scope-change" class="small" role="status"></div>
  </section>
  <section class="panel" style="margin-top:20px"><h2 class="section-title">所选范围内最近 60 条记录</h2><div class="table-wrap"><table><thead><tr><th>采集时间</th><th>连接数</th><th>结果</th><th>统计端口</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  <footer>ESTABLISHED 表示已建立连接；ALL 包含监听及其他 TCP 状态。按本机端口筛选，IPv4 / IPv6 一并统计。<br>缺测及超过 90 秒的采集间隔会断开曲线。时间按浏览器本地时区显示；鼠标移到曲线上可查看采样值。</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let records = [], visible = [], source = 'server', importedFile = null, requestVersion = 0;
let chartPoints = [], domain = null, customBounds = null, rangeBounds = null;
let readError = false;
const fmt = t => new Date(t * 1000).toLocaleString('zh-CN', { hour12: false });
const number = n => n == null ? '—' : n.toLocaleString('zh-CN');

function parseData(text) {
  const result = []; let invalid = 0;
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    try {
      const r = JSON.parse(line);
      if (!Number.isFinite(r.timestamp) || !Number.isFinite(new Date(r.timestamp * 1000).getTime()) ||
          !(r.count === null || (Number.isInteger(r.count) && r.count >= 0)) ||
          typeof r.state !== 'string' || !Array.isArray(r.ports)) throw new Error('invalid');
      if (r.ports.some(p => !Number.isInteger(p) || p < 1 || p > 65535) ||
          new Set(r.ports).size !== r.ports.length) throw new Error('invalid ports');
      r.ports.sort((a, b) => a - b);
      if (Object.hasOwn(r, 'port_counts')) {
        if (!r.port_counts || Array.isArray(r.port_counts) || typeof r.port_counts !== 'object' ||
            Object.keys(r.port_counts).length !== r.ports.length ||
            r.ports.some(p => !Object.hasOwn(r.port_counts, String(p)))) throw new Error('invalid port counts');
        const values = Object.values(r.port_counts);
        if (r.count === null ? values.some(v => v !== null) :
            values.some(v => !Number.isInteger(v) || v < 0) ||
            (r.ports.length && values.reduce((a, b) => a + b, 0) !== r.count)) throw new Error('invalid port total');
      }
      result.push(r);
    } catch (_) { invalid++; }
  }
  return { records: result.sort((a, b) => a.timestamp - b.timestamp), invalid };
}

async function load(nextSource = source, nextFile = importedFile, enableAuto = false) {
  const version = ++requestVersion;
  try {
    let text;
    if (nextSource === 'file') {
      if (!nextFile) return false;
      text = await nextFile.text();
    } else {
      if (location.protocol === 'file:') throw new Error('本地打开页面时，请点击“导入文本”选择下载的 tcp_connections.txt。');
      const response = await fetch('./tcp_connections.txt', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
      if (!response.ok) throw new Error('读取文本失败：HTTP ' + response.status);
      text = await response.text();
    }
    if (version !== requestVersion) return;
    const parsed = parseData(text);
    source = nextSource; importedFile = nextFile; readError = false;
    $('auto').disabled = source === 'file';
    if (source === 'file') $('auto').checked = false;
    else if (enableAuto) $('auto').checked = true;
    records = parsed.records;
    updatePorts();
    render();
    $('message').textContent = (source === 'file' ? '离线文件：更新后请重新导入。' : '服务器文本：' + ($('auto').checked ? '每 60 秒自动刷新。' : '自动刷新已暂停。')) +
      (parsed.invalid ? ` 已跳过 ${parsed.invalid} 行无效数据。` : '') +
      (records.length ? ' 最新采样：' + fmt(records[records.length - 1].timestamp) : ' 暂无采样数据。');
    return true;
  } catch (error) {
    if (version !== requestVersion) return;
    readError = true;
    $('badge').textContent = '读取失败';
    $('message').textContent = error.message + '；图中保留上次成功读取的数据。';
    return false;
  }
}

function updatePorts() {
  const selected = $('port').value;
  const ports = [...new Set(records.flatMap(r => r.ports))].sort((a, b) => a - b);
  $('port').replaceChildren(new Option('全部端口合计', 'all'));
  for (const port of ports) $('port').append(new Option(String(port), String(port)));
  $('port').value = selected === 'all' || ports.includes(Number(selected)) ? selected : 'all';
}

function portSample(row, selected) {
  if (selected === 'all') return row;
  if (!row.ports.includes(Number(selected))) return { ...row, count: null, error: '该样本未监控所选端口' };
  if (row.port_counts && Object.hasOwn(row.port_counts, selected)) return { ...row, count: row.port_counts[selected] };
  // A legacy single-port total is already that port's count; multi-port totals
  // cannot be reconstructed and must remain gaps when an individual is selected.
  if (row.ports.length === 1) return row;
  return { ...row, count: null, error: '旧版合计记录没有端口明细' };
}

function scopeKey(row) {
  return row.state + ':' + row.ports.join(',');
}

function scopeLabel(row) {
  return row.ports.length ? row.ports.join(', ') : '整机全部';
}

function statisticScope(row) {
  const selected = $('port').value;
  if (selected === 'all') return scopeLabel(row);
  return selected + (row.ports.includes(Number(selected)) ? '' : '（该次未监控）');
}

function render() {
  const mode = $('range').value;
  const end = source === 'file' && records.length ? records[records.length - 1].timestamp : Date.now() / 1000;
  rangeBounds = mode === 'custom' ? customBounds : Number(mode) ? [end - Number(mode) * 3600, end] : null;
  const selected = $('port').value;
  visible = records.filter(r => !rangeBounds || (r.timestamp >= rangeBounds[0] && r.timestamp <= rangeBounds[1]))
    .map(r => portSample(r, selected));
  if (selected === 'all') {
    visible = visible.map((row, index, rows) => ({ ...row,
      breakBefore: index > 0 && scopeKey(rows[index - 1]) !== scopeKey(row) }));
  }
  const changes = visible.filter(r => r.breakBefore).length;
  $('scope-change').textContent = selected === 'all' && changes ?
    `当前区间监控端口发生 ${changes} 次变化，合计曲线已在变化处断开。峰值和均值跨不同端口范围计算，仅供参考；明细和悬浮提示可查看每次监控端口。` :
    selected !== 'all' && visible.some(r => r.error === '该样本未监控所选端口') ?
      '当前区间部分时间未监控所选端口，显示为缺测，未计入均值。' : '';
  if (mode !== 'custom') {
    $('start').value = localInput(rangeBounds ? rangeBounds[0] : records[0]?.timestamp ?? end - 86400);
    $('end').value = localInput(rangeBounds ? rangeBounds[1] : end);
  }
  const valid = visible.filter(r => r.count !== null);
  const last = records[records.length - 1];
  $('current').textContent = number(visible[visible.length - 1]?.count);
  $('peak').textContent = valid.length ? number(valid.reduce((n, r) => Math.max(n, r.count), 0)) : '—';
  $('average').textContent = valid.length ? (valid.reduce((n, r) => n + r.count, 0) / valid.length).toFixed(1) : '—';
  $('samples').textContent = `${visible.length - valid.length} / ${visible.length}`;
  $('badge').textContent = readError ? '读取失败' : !last ? '等待数据' : source === 'file' ? '离线数据' : Date.now() / 1000 - last.timestamp > 150 ? '采集已超时' : last.count === null ? '采集失败' : '正在采集';
  $('scope').textContent = last ? `来源：${source === 'file' ? importedFile.name : '服务器文本'} · 状态：${last.state.toUpperCase()} · 当前统计：${selected === 'all' ? '全部端口合计' : '本机端口 ' + selected} · 最新采集范围：${scopeLabel(last)}` : '来源：tcp_connections.txt';
  $('legacy').textContent = selected !== 'all' && visible.some(r => r.error === '旧版合计记录没有端口明细') ?
    '当前区间包含旧版多端口合计记录，无法拆分的历史点显示为缺测；升级后新采集的数据可按端口查看。' : '';
  $('rows').replaceChildren();
  for (const r of visible.slice(-60).reverse()) {
    const tr = document.createElement('tr');
    for (const value of [fmt(r.timestamp), number(r.count), r.count === null ? '缺测：' + (r.error || '采集失败') : '成功', statisticScope(r)]) {
      const td = document.createElement('td'); td.textContent = value; tr.append(td);
    }
    $('rows').append(tr);
  }
  if (!visible.length) {
    const tr = document.createElement('tr'), td = document.createElement('td');
    td.colSpan = 4; td.textContent = '当前范围暂无记录'; tr.append(td); $('rows').append(tr);
  }
  draw();
}

function draw() {
  $('tooltip').style.display = 'none';
  const canvas = $('chart'), width = canvas.clientWidth, height = canvas.clientHeight;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio);
  const left = 58, right = width - 18, top = 30, bottom = height - 42;
  chartPoints = []; domain = null;
  ctx.font = '12px system-ui'; ctx.fillStyle = '#93a8c7';
  if (!visible.length) { ctx.textAlign = 'center'; ctx.fillText('当前范围暂无数据', width / 2, height / 2); return; }
  const start = rangeBounds ? rangeBounds[0] : visible[0].timestamp;
  const end = Math.max(start + 1, rangeBounds ? rangeBounds[1] : visible[visible.length - 1].timestamp);
  const maximum = Math.max(5, Math.ceil(visible.reduce((n, r) => Math.max(n, r.count || 0), 0) / 5) * 5);
  const x = t => left + (t - start) / (end - start) * (right - left);
  const y = v => bottom - v / maximum * (bottom - top);
  for (let i = 0; i <= 5; i++) {
    const yy = y(maximum * i / 5);
    ctx.strokeStyle = '#25354d'; ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(right, yy); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(number(maximum * i / 5), left - 10, yy + 4);
  }
  for (let i = 0; i <= 4; i++) {
    const t = start + (end - start) * i / 4;
    const date = new Date(t * 1000);
    ctx.textAlign = i === 0 ? 'left' : i === 4 ? 'right' : 'center';
    ctx.fillText(date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }), x(t), bottom + 19);
    ctx.fillText(date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }), x(t), bottom + 35);
  }
  // Reduce long histories per horizontal pixel, retaining extrema and gap boundaries.
  const points = []; let bucket = [], pixel = null;
  function flush() {
    if (!bucket.length) return;
    const min = bucket.reduce((a, b) => a.count <= b.count ? a : b);
    const max = bucket.reduce((a, b) => a.count >= b.count ? a : b);
    const picked = [...new Set([bucket[0], min, max, bucket[bucket.length - 1]])];
    points.push(...picked.sort((a, b) => a.timestamp - b.timestamp)); bucket = [];
  }
  let previous = null;
  for (const r of visible) {
    if (r.count === null || r.breakBefore || (previous && r.timestamp - previous.timestamp > 90)) {
      flush(); points.push(null); pixel = null;
    }
    if (r.count !== null) {
      const nextPixel = Math.floor(x(r.timestamp));
      if (nextPixel !== pixel) { flush(); pixel = nextPixel; }
      bucket.push(r);
    }
    previous = r;
  }
  flush();
  ctx.strokeStyle = '#60d9c0'; ctx.lineWidth = 2; ctx.beginPath(); let connected = false;
  for (const r of points) {
    if (!r) { connected = false; continue; }
    if (connected) ctx.lineTo(x(r.timestamp), y(r.count)); else ctx.moveTo(x(r.timestamp), y(r.count));
    connected = true; chartPoints.push(r);
  }
  ctx.stroke(); ctx.fillStyle = '#60d9c0';
  for (const r of chartPoints) { ctx.beginPath(); ctx.arc(x(r.timestamp), y(r.count), 1.8, 0, Math.PI * 2); ctx.fill(); }
  domain = { left, right, start, end };
}

$('chart').addEventListener('mousemove', event => {
  if (!domain || !visible.length) return;
  const rect = $('chart').getBoundingClientRect(), xx = event.clientX - rect.left;
  const time = domain.start + (xx - domain.left) / (domain.right - domain.left) * (domain.end - domain.start);
  let lo = 0, hi = visible.length - 1;
  while (lo < hi) { const mid = Math.floor((lo + hi) / 2); if (visible[mid].timestamp < time) lo = mid + 1; else hi = mid; }
  let r = visible[lo]; if (lo && Math.abs(visible[lo - 1].timestamp - time) < Math.abs(r.timestamp - time)) r = visible[lo - 1];
  const tip = $('tooltip'); tip.textContent = fmt(r.timestamp) + '\n连接数：' + (r.count === null ? '缺测（' + (r.error || '采集失败') + '）' : number(r.count)) +
    '\n统计端口：' + statisticScope(r) + ($('port').value !== 'all' ? '\n该次采集范围：' + scopeLabel(r) : '') +
    (r.breakBefore ? '\n监控端口范围变化，曲线从此处断开' : '');
  tip.style.maxWidth = rect.width + 'px'; tip.style.overflowWrap = 'anywhere';
  tip.style.display = 'block'; tip.style.left = Math.max(0, Math.min(xx + 12, rect.width - tip.offsetWidth)) + 'px'; tip.style.top = '8px';
});
$('chart').addEventListener('mouseleave', () => { $('tooltip').style.display = 'none'; });
function localInput(timestamp) {
  const d = new Date(timestamp * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
$('range').addEventListener('change', render);
$('port').addEventListener('change', () => { $('tooltip').style.display = 'none'; render(); });
$('apply').addEventListener('click', () => {
  const start = new Date($('start').value).getTime() / 1000, end = new Date($('end').value).getTime() / 1000;
  if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) {
    $('message').textContent = '请输入有效的开始、结束时间，结束时间必须晚于开始时间。'; return;
  }
  customBounds = [start, end]; $('range').value = 'custom'; render();
  $('message').textContent = `查看区间：${fmt(start)} — ${fmt(end)}。仅展示文本中仍保留的数据。`;
});
$('refresh').addEventListener('click', () => load());
$('online').addEventListener('click', () => load('server', importedFile, true));
$('auto').addEventListener('change', () => {
  if (!readError && source === 'server') $('message').textContent = $('message').textContent.replace(
    /^服务器文本：[^。]*。/, '服务器文本：' + ($('auto').checked ? '每 60 秒自动刷新。' : '自动刷新已暂停。'));
});
$('file').addEventListener('change', event => {
  const file = event.target.files[0]; if (!file) return;
  load('file', file);
  event.target.value = '';
});
new ResizeObserver(draw).observe($('chart'));
setInterval(() => { if ($('auto').checked && source === 'server') load(); }, 60000);
load();
</script>
</body>
</html>
